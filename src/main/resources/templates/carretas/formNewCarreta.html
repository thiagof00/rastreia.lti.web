<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar carreta</title>
</head>

<body>

    <th:block th:fragment="content">
        <main class="content">
            <form
                th:action="${carretaForm.id == null} ? @{/nova-carreta} : @{/editar-carreta/{id}(id=${carretaForm.id})}"
                method="post" th:object="${carretaForm}" class="form-card">
                <div class="form-card-header">
                    <div>
                        <div class="form-card-title"><i class="ti ti-steering-wheel"></i>
                            <span
                                th:text="${carretaForm.id == null} ? 'Cadastro de carreta' : 'Edição de carreta'"></span>
                        </div>
                        <div class="form-card-subtitle"
                            th:text="${carretaForm.id == null} ? 'Preencha os dados da nova carreta.' : 'Altere os dados da carreta.'">
                        </div>
                    </div>
                    <button class="btn btn-ghost btn-sm"><i class="ti ti-arrow-left" th:href="@{/carretas}"></i>
                        Voltar</button>
                </div>

                <div class="form-card-body">
                    <div class="form-divider"><span>Identificação</span></div>
                    <div class="fields-grid">
                        <div class="field">
                            <label class="field-label">Placa <span class="req">*</span></label>
                            <div class="input-wrap">
                                <i class="ti ti-certificate icon-left"></i>
                                <input th:field="*{placa}" type="text" placeholder="ABC-1234" maxlength="8"
                                    style="font-family:var(--mono); letter-spacing:1px; text-transform:uppercase;">
                            </div>
                            <div class="field-hint">Formato Mercosul ou antigo (ex: ABC1D23 ou ABC-1234).</div>
                        </div>
                        <div class="field">
                            <label class="field-label">Modelo / configuração <span class="req">*</span></label>
                            <select th:field="*{tipo}">
                                <option value="">Selecione o tipo</option>
                                <option value="Sider">Sider</option>
                                <option value="Grade alta">Grade alta</option>
                                <option value="Grade baixa">Grade baixa</option>
                                <option value="Bau">Bau</option>
                                <option value="3 eixos">3 eixos</option>
                                <option value="4 eixo">4 eixo</option>
                                <option value="3 eixos espaçado">3 eixos espaçado(Vanderleia)</option>
                                <option value="Bitrem">Bitrem</option>
                                <option value="Rodotrem">Rodotrem</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="field-label">Peso máximo</label>
                            <div class="input-wrap">
                                <i class="ti ti-certificate icon-left"></i>
                                <input th:field="*{pesoMax}" type="text" placeholder="20000" maxlength="6"
                                    style="font-family:var(--mono); letter-spacing:1px; text-transform:uppercase;">
                            </div>
                        </div>


                        <div class="field">
                            <label for="field-label">Metragem</label>
                            <div class="input-wrap">
                                <i class="ti ti-certificate icon-left"></i>
                                <input th:field="*{metragem}" type="text" placeholder="20000" maxlength="6"
                                    style="font-family:var(--mono); letter-spacing:1px; text-transform:uppercase;">
                            </div>
                        </div>


                    </div>

                    <div class=" form-divider"><span>Status</span>
                    </div>
                    <div class="field">
                        <label class="field-label" for="status-caminhao">Status inicial <span
                                class="req">*</span></label>
                        <select class="field-select" id="status-caminhao" th:field="*{status}" required>
                            <option value="OCIOSO">Ocioso</option>
                            <option value="EM_MANUTENCAO">Em manutenção</option>
                        </select>
                    </div>
                </div>

                <div class="form-footer">
                    <span></span>
                    <div class="form-footer-right">
                        <button type="button" class="btn btn-cancel" th:onclick="|location.href='@{/carretas}'|"><i
                                class="ti ti-x"></i>
                            Cancelar</button>
                        <button type="submit" class="btn btn-submit"><i class="ti ti-check"></i> <span
                                th:text="${carretaForm.id == null} ? 'Cadastrar carreta' : 'Alterar carreta'"></span></button>
                    </div>
                </div>
            </form>

        </main>
    </th:block>

</body>

</html>
