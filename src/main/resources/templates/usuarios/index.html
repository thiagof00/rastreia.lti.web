<!-- templates/cargas.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">

<body>
    <th:block th:fragment="content">

        <header class="topbar">
            <div class="topbar-left">
                <div class="page-title">Usuários</div>
                <div class="breadcrumb"><i class="ti ti-chevron-right" style="font-size:14px"></i><span>Gerenciar</span>
                </div>
            </div>
            <div class="topbar-right">
                <form class="search-wrap search-wrap-expanded" id="busca-lista" method="get" th:action="@{/usuarios}">
                    <i class="ti ti-search" aria-hidden="true"></i>
                    <input class="search-input" type="search" name="busca" th:value="${busca}"
                        aria-label="Buscar usuarios" placeholder="Buscar por nome, CPF ou e-mail...">
                </form>
                <button class="btn btn-primary" th:onclick="|window.location.href='@{/novo-usuario}'|"><i
                        class="ti ti-user-plus"></i>
                    Cadastrar Usuário</button>
            </div>
        </header>
        <main class="content">
            <div class="stats-row cols-4">
                <div class="stat-card">
                    <div class="stat-icon si-purple"><i class="ti ti-users"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" style="color:var(--purple-500)" th:text="${totalUsuarios}"></div>
                        <div class="stat-label">Total cadastrados</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon si-green"><i class="ti ti-circle-check"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" style="color:var(--green-600)">3</div>
                        <div class="stat-label">ADMINs</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon si-amber"><i class="ti ti-route"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" style="color:var(--amber-600)">5</div>
                        <div class="stat-label">CLIENTES</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon si-gray"><i class="ti ti-circle-x"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" style="color:var(--gray-600)">2</div>
                        <div class="stat-label">DEVs</div>
                    </div>
                </div>
            </div>
            <div class="card lista-paginada" id="resultados-busca">
                <div class="card-header">
                    <div class="card-title"><i class="ti ti-list"></i> Lista de usuários</div>
                    <div class="card-actions">
                        <select class="filter-select">
                            <option>Todos os tipos</option>
                            <option th:each="tipoUsuario : ${tiposUsuario}" th:value="${tipoUsuario}"
                                th:text="${tipoUsuario}"></option>
                        </select>
                    </div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th class="sortable">ID</th>
                                <th class="sortable">Usuario</th>
                                <th>CPF</th>
                                <th>Email</th>
                                <th>Tipo</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>



                            <tr th:each="usuario : ${usuarios}">
                                <td th:text="${usuario.getId()}" class="td-mono">#M01</td>
                                <td><span class="mini-avatar">CS</span><span th:text="${usuario.getNome()}"></span>
                                    <span th:text="${usuario.getSobrenome()}"></span>
                                </td>
                                <td th:text="${usuario.getCpf()}" class="td-mono">123.456.789-00</td>
                                <td th:text="${usuario.getEmail()}" class="td-mono"></td>
                                <td><span th:text="${usuario.getTipo_usuario()}">#001</span></td>
                                <td>
                                    <div class="row-actions">
                                        <button class="row-btn edit" title="Editar"
                                            th:onclick="|location.href='@{/editar-usuario/{id}(id=${usuario.getId()})}'|">

                                            <i class="ti ti-edit"></i></button>
                                        <button type="button" class="row-btn del" title="Excluir"
                                            th:data-nome="|${usuario.nome} ${usuario.sobrenome}|"
                                            th:data-action="@{/excluir-usuario/{id}(id=${usuario.id})}"
                                            onclick="openModal('modal-delete', this)">
                                            <i class="ti ti-trash"></i></button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <span class="pagination-info"
                        th:text="${paginaUsuarios.totalElements == 0} ? 'Nenhum usuário encontrado' : |Mostrando ${primeiroRegistro}–${ultimoRegistro} de ${paginaUsuarios.totalElements} registros|"></span>
                    <nav class="pagination-btns" aria-label="Páginas de usuários" th:if="${paginaUsuarios.totalPages > 1}">
                        <a class="page-btn" aria-label="Página anterior" th:if="${paginaUsuarios.hasPrevious()}"
                            th:href="@{/usuarios(pagina=${numeroPagina - 1},busca=${busca})}"><i class="ti ti-chevron-left"></i></a>
                        <button class="page-btn" type="button" aria-label="Página anterior"
                            th:unless="${paginaUsuarios.hasPrevious()}" disabled><i class="ti ti-chevron-left"></i></button>
                        <a class="page-btn" th:each="pagina : ${#numbers.sequence(1, paginaUsuarios.totalPages)}"
                            th:href="@{/usuarios(pagina=${pagina},busca=${busca})}" th:text="${pagina}"
                            th:classappend="${pagina == numeroPagina} ? 'active'"
                            th:attr="aria-current=${pagina == numeroPagina} ? 'page' : null"></a>
                        <a class="page-btn" aria-label="Próxima página" th:if="${paginaUsuarios.hasNext()}"
                            th:href="@{/usuarios(pagina=${numeroPagina + 1},busca=${busca})}"><i class="ti ti-chevron-right"></i></a>
                        <button class="page-btn" type="button" aria-label="Próxima página"
                            th:unless="${paginaUsuarios.hasNext()}" disabled><i class="ti ti-chevron-right"></i></button>
                    </nav>
                </div>
            </div>
        </main>
        <script th:src="@{/busca-lista.js}" defer></script>

    </th:block>
</body>

</html>
