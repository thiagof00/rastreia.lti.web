<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreia LTI</title>
    <script th:src="@{/tema.js}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/global.css}">
    <link rel="stylesheet" th:href="@{/responsive.css}">

</head>

<body>
    <div th:replace="~{fragments/toast :: toast}"></div>
    <div class="app">

        <!-- ══ SIDEBAR — definida uma vez, herdada por todos ══ -->
        <aside class="sidebar">
            <div class="sb-brand">
                <div class="sb-brand-row">
                    <div class="sb-icon"><i class="ti ti-route"></i></div>
                    <span class="sb-name">RASTREIA.LTI</span>
                </div>
                <div class="sb-sub">Sistema de rastreamento</div>
            </div>

            <div class="sb-user">
                <div class="avatar">AD</div>
                <div>
                    <div class="user-name">admin</div>
                    <div class="user-role">Administrador</div>
                </div>
            </div>

            <nav class="nav">
                <div class="nav-label">Principal</div>
                <div class="nav-item" data-tooltip="Dashboard"
                    th:classappend="${paginaAtiva == 'dashboard'} ? 'active'">
                    <a th:href="@{/dashboard}"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
                </div>

                <div class="nav-label">Gerenciar</div>
                <div class="nav-item" data-tooltip="Cargas" th:classappend="${paginaAtiva == 'cargas'} ? 'active'">
                    <a th:href="@{/cargas}"><i class="ti ti-package"></i> Cargas</a>
                </div>
                <div class="nav-item" data-tooltip="Etapas" th:classappend="${paginaAtiva == 'etapas'} ? 'active'">
                    <a th:href="@{/etapas}"><i class="ti ti-map-pin"></i> Etapas</a>
                </div>
                <div class="nav-item" data-tooltip="Motoristas"
                    th:classappend="${paginaAtiva == 'motoristas'} ? 'active'">
                    <a th:href="@{/motoristas}"><i class="ti ti-user-check"></i> Motoristas</a>
                </div>
                <div class="nav-item" data-tooltip="Caminhões"
                    th:classappend="${paginaAtiva == 'caminhoes'} ? 'active'">
                    <a th:href="@{/caminhoes}"><i class="ti ti-steering-wheel"></i> Caminhões</a>
                </div>
                <div class="nav-item" data-tooltip="Carretas" th:classappend="${paginaAtiva == 'carretas'} ? 'active'">
                    <a th:href="@{/carretas}"><i class="ti ti-truck"></i> Carretas</a>
                </div>
                <div class="nav-item" data-tooltip="Usuários" th:classappend="${paginaAtiva == 'usuarios'} ? 'active'">
                    <a th:href="@{/novo-usuario}"><i class="ti ti-users-group"></i> Usuários</a>
                </div>
                <div class="nav-item" data-tooltip="Carretas" th:classappend="${paginaAtiva == 'carretas'} ? 'active'">
                    <a><i class="ti ti-building-arch"></i> Clientes </a>
                </div>
            </nav>

            <div class="sb-bottom">
                <button type="button" class="nav-item theme-toggle" id="theme-toggle" aria-pressed="false" hidden>
                    <i class="ti ti-moon" aria-hidden="true"></i>
                    <span>Modo escuro</span>
                </button>
                <div class="nav-item danger">
                    <a th:href="@{/logout}"><i class="ti ti-logout"></i> Sair</a>
                </div>
            </div>
        </aside>

        <!-- ══ CONTEÚDO DA PÁGINA ══ -->
        <div class="main">
            <th:block th:replace="${content}" />
        </div>

    </div>

    <div class="modal-overlay" id="modal-delete" onclick="if (event.target === this) closeModal('modal-delete')">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title"><i class="ti ti-trash"></i> Confirmar exclusão</div>
                <button type="button" class="modal-close" onclick="closeModal('modal-delete')">
                    <i class="ti ti-x"></i>
                </button>
            </div>
            <form method="post">
                <div class="modal-body">
                    <div class="delete-icon"><i class="ti ti-alert-triangle"></i></div>
                    <div class="delete-msg">
                        <p>Tem certeza que deseja inativar <strong data-modal-nome></strong>?</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" onclick="closeModal('modal-delete')">Cancelar</button>
                    <button type="submit" class="btn btn-danger"><i class="ti ti-trash"></i> Inativar</button>
                </div>
            </form>
        </div>
    </div>




    <script>
        function openModal(id, origem) {
            const modal = document.getElementById(id);
            if (!modal) return;
            if (origem) {
                const nome = modal.querySelector('[data-modal-nome]');
                const form = modal.querySelector('form');
                if (nome) nome.textContent = origem.dataset.nome;
                if (form) {
                    form.reset()
                    form.action = origem.dataset.action
                    Object.entries(origem.dataset).forEach(([chave, valor]) => {
                        form.querySelectorAll(`[name=${chave}]`).forEach(campo => {
                            if (campo.type === 'radio') campo.checked = campo.value === valor
                            else campo.value = valor
                        })
                    })
                }
            }
            modal.classList.add('open');
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.remove('open');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
            }
        });


    </script>

</body>

</html>
