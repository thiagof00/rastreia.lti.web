<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">

<body>
    <th:block th:fragment="content">
        <main class="content">
            <form th:action="@{/novo-cliente}" method="post" th:object="${clienteForm}" class="form-card">
                <div class="form-card-header">
                    <div>
                        <div class="form-card-title"><i class="ti ti-user-plus"></i> Cadastro de cliente</div>
                        <div class="form-card-subtitle">Preencha os dados do novo cliente.</div>
                    </div>
                    <a class="btn btn-ghost btn-sm" th:href="@{/clientes}">Voltar</a>
                </div>

                <div class="form-card-body">
                    <div class="alert alert-error show" role="alert" th:if="${erro}" th:text="${erro}"></div>
                    <div class="alert alert-success show" role="status" th:if="${sucesso}" th:text="${sucesso}"></div>
                    <div class="fields-grid">
                        <div class="field">
                            <label class="field-label" for="razao_social">Razão social <span
                                    class="req">*</span></label>
                            <div class="input-wrap">
                                <input type="text" th:field="*{razao_social}" maxlength="200" required>
                            </div>
                        </div>
                        <div class="field">
                            <label class="field-label" for="nome_fantasia">Nome Fantasia <span
                                    class="req">*</span></label>
                            <div class="input-wrap">
                                <input type="text" th:field="*{nome_fantasia}" maxlength="200" required>
                            </div>
                        </div>
                        <div class="field">
                            <label class="field-label" for="cpf">CPF<span class="req"></span></label>
                            <div class="input-wrap">
                                <input type="text" th:field="*{cpf}" maxlength="14"
                                    pattern="[0-9]{11}|[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                                    placeholder="000.000.000-00" aria-describedby="cpf-ajuda">
                            </div>
                            <div class="field-hint" id="cpf-ajuda">Informe 11 números, com ou sem pontuação.</div>
                        </div>
                        <div class="field">
                            <label class="field-label" for="cnpj">CNPJ<span class="req">*</span></label>
                            <div class="input-wrap">
                                <input type="text" th:field="*{cnpj}" maxlength="14" placeholder="00.000.000/0000-00"
                                    aria-describedby="cnpj-ajuda">
                            </div>
                            <div class="field-hint" id="cnpj-ajuda">Informe 14 números sem pontuação.</div>
                        </div>

                        <div class="field">
                            <label class="field-label" for="usuario">Usuario <span class="req">*</span></label>
                            <div class="input-wrap">

                                <select name="usuario" class="filter-select" th:field="*{usuario}">
                                    <option th:each="usuario : ${usuarios}" th:value="${usuario.getId()}"
                                        th:text="| Usuário CNPJ/CPF: ${usuario.getCpf()} (${usuario.getEmail()}) |">
                                        Usuario
                                        CNPJ : 00.000.000/0000-00 (thiago@iffar.com.br)</option>
                                </select>
                            </div>
                        </div>

                    </div>
                </div>

                <div class="form-footer">
                    <span></span>
                    <div class="form-footer-right">
                        <a class="btn btn-cancel" th:href="@{/clientes}">Cancelar</a>
                        <button type="submit" class="btn btn-submit">Cadastrar usuário</button>
                    </div>
                </div>
            </form>
        </main>
        <script th:src="@{/password-toggle.js}" defer></script>
    </th:block>
</body>

</html>
