<!-- templates/cargas.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">

<body>
    <th:block th:fragment="content">

        <header class="topbar">
            <div class="topbar-left">
                <div class="page-title">Usuários</div>
                <div class="breadcrumb"><i class="ti ti-chevron-right" style="font-size:14px"></i><span>Gerenciar</span>
                </div>
            </div>
            <div class="topbar-right">
                <div class="search-wrap"><i class="ti ti-search"></i><input class="search-input"
                        placeholder="Buscar por nome ou CPF..."></div>
                <button class="btn btn-primary" th:onclick="|window.location.href='@{/novo-cliente}'|"><i
                        class="ti ti-user-plus"></i>
                    Cadastrar</button>
            </div>
        </header>
        <main class="content">
            <div class="stats-row cols-4">
                <div class="stat-card">
                    <div class="stat-icon si-purple"><i class="ti ti-users"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" style="color:var(--purple-500)" th:text="${totalClientes}"></div>
                        <div class="stat-label">Total cadastrados</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon si-green"><i class="ti ti-circle-check"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" style="color:var(--green-600)">3</div>
                        <div class="stat-label">...</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon si-amber"><i class="ti ti-route"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" style="color:var(--amber-600)">5</div>
                        <div class="stat-label">...</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon si-gray"><i class="ti ti-circle-x"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" style="color:var(--gray-600)">2</div>
                        <div class="stat-label">...</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><i class="ti ti-list"></i> Lista de clientes</div>
                    <div class="card-actions">
                        <!-- <select class="filter-select">
                            <option>Todos os tipos</option>
                            <option th:each="tipoUsuario : ${tiposUsuario}" th:value="${tipoUsuario}"
                                th:text="${tipoUsuario}"></option>
                        </select> -->
                    </div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th class="sortable">Razão social</th>
                                <th class="sortable">Nome fantasia</th>
                                <th>CPF</th>
                                <th>CNPJ</th>
                                <th>Usuário</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>



                            <tr th:each="cliente : ${clientes}">
                                <td th:text="${cliente.getRazao_social()}" class="td-mono"></td>
                                <td><span class="mini-avatar">CS</span><span
                                        th:text="${cliente.getNome_fantasia()}"></span>
                                </td>
                                <td th:text="${cliente.getCpf()}" class="td-mono"></td>
                                <td th:text="${cliente.getCnpj()}" class="td-mono"></td>
                                <td><span th:text="${cliente.getUsuario().getEmail()}"></span></td>
                                <td>
                                    <div class="row-actions">
                                        <button class="row-btn edit" title="Editar"
                                            th:onclick="|location.href='@{/editar-cliente/{id}(id=${cliente.getId()})}'|">

                                            <i class="ti ti-edit"></i></button>
                                        <button type="button" class="row-btn del" title="Excluir"
                                            th:data-nome="|${cliente.getRazao_social()} ${cliente.getNome_fantasia()}|"
                                            th:data-action="@{/excluir-cliente/{id}(id=${cliente.id})}"
                                            onclick="openModal('modal-delete', this)">
                                            <i class="ti ti-trash"></i></button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <span class="pagination-info"
                        th:text="${totalClientes == 0} ? 'Nenhum cliente cadastrado' : |Mostrando ${primeiroRegistro}–${ultimoRegistro} de ${totalClientes} registros|"></span>
                    <nav class="pagination-btns" aria-label="Páginas de clientes"
                        th:if="${paginaClientes.totalPages > 1}">
                        <a class="page-btn" aria-label="Página anterior" th:if="${paginaClientes.hasPrevious()}"
                            th:href="@{/clientes(pagina=${numeroPagina - 1})}"><i class="ti ti-chevron-left"></i></a>
                        <button class="page-btn" type="button" aria-label="Página anterior"
                            th:unless="${paginaClientes.hasPrevious()}" disabled><i
                                class="ti ti-chevron-left"></i></button>
                        <a class="page-btn" th:each="pagina : ${#numbers.sequence(1, paginaClientes.totalPages)}"
                            th:href="@{/clientes(pagina=${pagina})}" th:text="${pagina}"
                            th:classappend="${pagina == numeroPagina} ? 'active'"
                            th:attr="aria-current=${pagina == numeroPagina} ? 'page' : null"></a>
                        <a class="page-btn" aria-label="Próxima página" th:if="${paginaClientes.hasNext()}"
                            th:href="@{/clientes(pagina=${numeroPagina + 1})}"><i class="ti ti-chevron-right"></i></a>
                        <button class="page-btn" type="button" aria-label="Próxima página"
                            th:unless="${paginaClientes.hasNext()}" disabled><i
                                class="ti ti-chevron-right"></i></button>
                    </nav>
                </div>
            </div>
        </main>

    </th:block>
</body>

</html>
