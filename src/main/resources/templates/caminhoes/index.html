<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">

<body>
    <th:block th:fragment="content">

        <header class="topbar">
            <div class="topbar-left">
                <div class="page-title">Caminhões</div>
                <div class="breadcrumb"><i class="ti ti-chevron-right" style="font-size:14px"></i><span>Gerenciar</span>
                </div>
            </div>
            <div class="topbar-right">
                <div class="search-wrap"><i class="ti ti-search"></i><input class="search-input"
                        placeholder="Buscar por placa ou tipo..."></div>
                <button class="btn btn-primary" th:onclick="|window.location.href='@{/novo-caminhao}'|"><i
                        class="ti ti-plus"></i>
                    Cadastrar</button>
            </div>
        </header>
        <main class="content">
            <div class="stats-row cols-4">
                <div class="stat-card">
                    <div class="stat-icon si-purple"><i class="ti ti-steering-wheel"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" style="color:var(--purple-500)" th:text="${totalCaminhoes}"></div>
                        <div class="stat-label">Total cadastrados</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon si-green"><i class="ti ti-circle-check"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" style="color:var(--green-600)">4</div>
                        <div class="stat-label">Ociosos</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon si-amber"><i class="ti ti-route"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" style="color:var(--amber-600)">6</div>
                        <div class="stat-label">Em viagem</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon si-blue"><i class="ti ti-tool"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" style="color:var(--blue-600)">2</div>
                        <div class="stat-label">Em manutenção</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><i class="ti ti-list"></i> Lista de caminhões</div>
                    <div class="card-actions">
                        <select class="filter-select">
                            <option>Todos os status</option>
                            <option>Ocioso</option>
                            <option>Em viagem</option>
                            <option>Em manutenção</option>
                        </select>
                        <select class="filter-select">
                            <option>Todos os tipos</option>
                            <option>Toco</option>
                            <option>Truck</option>
                            <option>Cavalo Mecânico</option>
                        </select>
                    </div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>

                                <th class="sortable">Placa</th>
                                <th>Tipo</th>
                                <th>Status</th>
                                <th>Em uso por</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="caminhao : ${caminhoes}">

                                <td th:text="${caminhao.getPlaca()}" class="td-mono">ABC-1234</td>
                                <td th:text="${caminhao.getModelo()}">Cavalo Mecânico 6x4</td>
                                <td><span class="badge badge-amber" th:text="${caminhao.getStatus()}">Em viagem</span>
                                </td>
                                <td>Carga <span>#001</span></td>
                                <td>
                                    <div class="row-actions">
                                        <button type="button" class="row-btn edit" title="Editar"
                                            th:onclick="|location.href='@{/editar-caminhao/{id}(id=${caminhao.getId()})}'|"><i
                                                class="ti ti-edit"></i></button>


                                        <button type="button" class="row-btn del" title="Excluir"
                                            th:data-nome="|caminhão ${caminhao.placa}|"
                                            th:data-action="@{/excluir-caminhao/{id}(id=${caminhao.id})}"
                                            onclick="openModal('modal-delete', this)"><i
                                                class="ti ti-trash"></i></button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <span class="pagination-info"
                        th:text="${totalCaminhoes == 0} ? 'Nenhum caminhão cadastrado' : |Mostrando ${primeiroRegistro}–${ultimoRegistro} de ${totalCaminhoes} registros|"></span>
                    <nav class="pagination-btns" aria-label="Páginas de caminhões"
                        th:if="${paginaCaminhoes.totalPages > 1}">
                        <a class="page-btn" aria-label="Página anterior" th:if="${paginaCaminhoes.hasPrevious()}"
                            th:href="@{/caminhoes(pagina=${numeroPagina - 1})}"><i class="ti ti-chevron-left"></i></a>
                        <button class="page-btn" type="button" aria-label="Página anterior"
                            th:unless="${paginaCaminhoes.hasPrevious()}" disabled><i
                                class="ti ti-chevron-left"></i></button>
                        <a class="page-btn" th:each="pagina : ${#numbers.sequence(1, paginaCaminhoes.totalPages)}"
                            th:href="@{/caminhoes(pagina=${pagina})}" th:text="${pagina}"
                            th:classappend="${pagina == numeroPagina} ? 'active'"
                            th:attr="aria-current=${pagina == numeroPagina} ? 'page' : null"></a>
                        <a class="page-btn" aria-label="Próxima página" th:if="${paginaCaminhoes.hasNext()}"
                            th:href="@{/caminhoes(pagina=${numeroPagina + 1})}"><i class="ti ti-chevron-right"></i></a>
                        <button class="page-btn" type="button" aria-label="Próxima página"
                            th:unless="${paginaCaminhoes.hasNext()}" disabled><i
                                class="ti ti-chevron-right"></i></button>
                    </nav>
                </div>
            </div>
        </main>

    </th:block>
</body>

</html>
