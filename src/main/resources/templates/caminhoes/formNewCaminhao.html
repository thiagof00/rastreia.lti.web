<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">

<body>
    <th:block th:fragment="content">
        <main class="content">
            <form
                th:action="${caminhaoForm.id == null} ? @{/novo-caminhao} : @{/editar-caminhao/{id}(id=${caminhaoForm.id})}"
                method="post" th:object="${caminhaoForm}" class="form-card">
                <div class="form-card-header">
                    <div>
                        <div class="form-card-title"><i class="ti ti-steering-wheel"></i> <span
                                th:text="${caminhaoForm.id == null} ? 'Cadastro de caminhão' : 'Alterar caminhão' "></span>
                        </div>
                        <div class="form-card-subtitle">Preencha os dados do caminhão.</div>
                    </div>
                    <button class="btn btn-ghost btn-sm"><i class="ti ti-arrow-left"></i> Voltar</button>
                </div>

                <div class="form-card-body">
                    <div class="form-divider"><span>Identificação do veículo</span></div>
                    <div class="fields-grid">
                        <div class="field">
                            <label class="field-label">Placa <span class="req">*</span></label>
                            <div class="input-wrap">
                                <i class="ti ti-certificate icon-left"></i>
                                <input th:field="*{placa}" type="text" placeholder="ABC-1234" maxlength="8"
                                    style="font-family:var(--mono); letter-spacing:1px; text-transform:uppercase;">
                            </div>
                            <div class="field-hint">Formato Mercosul ou antigo (ex: ABC1D23 ou ABC-1234).</div>
                        </div>
                        <div class="field">
                            <label class="field-label">Modelo / configuração <span class="req">*</span></label>
                            <select th:field="*{modelo}">
                                <option value="">Selecione o tipo</option>
                                <option value="Toco">Toco</option>
                                <option value="Truck">Truck</option>
                                <option value="Bitruck">Bitruck</option>
                                <option value="Cavalo Mecânico 4x2">Cavalo Mecânico 4x2</option>
                                <option value="Cavalo Mecânico 6x2">Cavalo Mecânico 6x2</option>
                                <option value="Cavalo Mecânico 6x4">Cavalo Mecânico 6x4</option>
                                <option value="Cavalo Mecânico 8x4">Cavalo Mecânico 8x4</option>
                            </select>
                        </div>
                        <div class="field">
                            <label class="field-label">Marca do caminhão <span class="req">*</span></label>
                            <input th:field="*{marca}" type="text" placeholder="Scania"
                                style="font-family:var(--mono); letter-spacing:1px;">
                        </div>
                    </div>

                    <div class=" form-divider"><span>Status</span>
                    </div>
                    <div class="field">
                        <label class="field-label" for="status-caminhao">Status inicial <span
                                class="req">*</span></label>
                        <select class="field-select" id="status-caminhao" th:field="*{status}" required>
                            <option value="OCIOSO">Ocioso</option>
                            <option value="EM_MANUTENCAO">Em manutenção</option>
                        </select>
                    </div>
                </div>

                <div class="form-footer">
                    <span></span>
                    <div class="form-footer-right">
                        <button type="button" th:onclick="|location.href='@{/caminhoes}'|" class="btn btn-cancel"><i
                                class="ti ti-x"></i>
                            Cancelar</button>
                        <button type="submit" class="btn btn-submit"><i class="ti ti-check"></i> <span
                                th:text="${caminhaoForm.id == null} ? 'Cadastrar de caminhão' : 'Alterar caminhão'"></span></button>
                    </div>
                </div>
            </form>

        </main>
    </th:block>
</body>

</html>
